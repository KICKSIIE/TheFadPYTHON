<dialog class="modal" id="form-approval-modal" aria-labelledby="form-approval-title" aria-describedby="form-approval-message">
  <form class="modal-body" id="form-approval">
    <span class="eyebrow">Authorization</span>
    <h2 class="modal-title" id="form-approval-title">Admin approval</h2>
    <p class="modal-copy" id="form-approval-message"></p>
    {% if current_user.role != 'Admin' %}
    <div class="field modal-field">
      <label for="form-approval-username">Approving admin</label>
      <input id="form-approval-username" name="approval_username" type="text" autocomplete="off" required>
    </div>
    {% endif %}
    <div class="field modal-field">
      <label for="form-approval-pin">Approval PIN</label>
      <input id="form-approval-pin" name="approval_pin" type="password" inputmode="numeric" pattern="[0-9]{6,12}"
             placeholder="6–12 digits" autocomplete="off" required>
    </div>
    <div class="modal-actions">
      <button class="btn btn-quiet" type="button" data-approval-cancel>Cancel</button>
      <button class="btn" type="submit" id="form-approval-confirm">Confirm</button>
    </div>
  </form>
</dialog>
