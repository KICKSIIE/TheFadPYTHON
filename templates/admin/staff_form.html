{% extends "base.html" %}
{% block title %}{{ 'Edit staff' if editing else 'Add staff' }}{% endblock %}
{% block content %}
<div class="head">
  <h1>{{ 'Edit staff' if editing else 'Add staff' }}{% if editing %} <span class="muted small id-cell">User #{{ user_id }}</span>{% endif %}</h1>
  <a class="btn btn-quiet" href="{{ url_for('admin_staff.index') }}">Back</a>
</div>
<form class="form wide" method="post"
      action="{{ url_for('admin_staff.edit', {user_id: user_id}) if editing else url_for('admin_staff.new') }}">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <div class="field-grid">
    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" value="{{ person.username or '' }}" {{ 'readonly' if editing else 'required' }} autocomplete="off">
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" value="{{ person.email or '' }}" required>
    </div>
    <div class="field">
      <label for="first_name">First name</label>
      <input id="first_name" name="first_name" value="{{ person.first_name or '' }}" maxlength="50" required>
    </div>
    <div class="field">
      <label for="last_name">Last name</label>
      <input id="last_name" name="last_name" value="{{ person.last_name or '' }}" maxlength="50" required>
    </div>
    <div class="field">
      <label for="user_type">Role</label>
      <select id="user_type" name="user_type">
        <option value="CA" {{ 'selected' if person.user_type == 'CA' }}>Cashier</option>
        <option value="AD" {{ 'selected' if person.user_type == 'AD' }}>Admin</option>
      </select>
    </div>
    <div class="field">
      <label for="station">Station <span class="muted small">(optional)</span></label>
      <input id="station" name="station" value="{{ person.station or '' }}" maxlength="50" placeholder="Counter 1">
    </div>
    <div class="field">
      <label for="hired_on">Start date</label>
      <input id="hired_on" name="hired_on" type="date" value="{{ person.hired_on.isoformat() if person.hired_on and person.hired_on.isoformat else (person.hired_on or '') }}">
    </div>
    {% if not editing %}
    <div class="field">
      <label for="password">Temporary password</label>
      <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" placeholder="8 or more characters" required>
    </div>
    {% endif %}
  </div>
  <div class="form-actions">
    <button class="btn" type="submit">{{ 'Save changes' if editing else 'Create account' }}</button>
    <a class="btn btn-quiet" href="{{ url_for('admin_staff.index') }}">Cancel</a>
  </div>
</form>
{% endblock %}
