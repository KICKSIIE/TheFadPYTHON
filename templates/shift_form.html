{% extends "base.html" %}
{% block title %}{{ 'Edit shift' if shift.dtr_id else 'Add shift' }}{% endblock %}
{% block content %}
<div class="head">
  <h1>{{ 'Edit shift' if shift.dtr_id else 'Add shift' }}</h1>
  <div><a class="btn btn-quiet" href="{{ url_for('attendance.everyone') }}">Back</a></div>
</div>
<form class="form wide" method="post" action="{{ url_for('attendance.edit_shift', {dtr_id: shift.dtr_id}) if shift.dtr_id else url_for('attendance.new_shift') }}">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <label for="user_id">Staff</label>
  <select id="user_id" name="user_id" required>
    <option value="">Choose</option>
    {% for s in staff %}<option value="{{ s.user_id }}" {{ 'selected' if shift.user_id|string == s.user_id|string }}>{{ s.first_name }} {{ s.last_name }}</option>{% endfor %}
  </select>
  <div class="two">
    <div><label for="time_in">Time in</label><input id="time_in" type="datetime-local" name="time_in" value="{{ shift.time_in }}" required></div>
    <div><label for="time_out">Time out</label><input id="time_out" type="datetime-local" name="time_out" value="{{ shift.time_out }}" required></div>
  </div>
  <label for="note">Reason</label>
  <input id="note" name="note" value="{{ shift.note or '' }}" maxlength="200" placeholder="e.g. forgot to clock in" required>
  <div class="form-actions"><button class="btn" type="submit">Save shift</button></div>
</form>
{% endblock %}
